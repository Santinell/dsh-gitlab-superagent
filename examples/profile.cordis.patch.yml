# Profile overrides, applied after the dsh-gitlab-superagent bundle patch.
# Keep this entry ID and the profile name stable when updating the npm package.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    # A NEW absolute stateDir for this GitLab installation; replace the placeholder.
    stateDir: <absolute-new-state-directory>
# Source project/host/cli and policy.allowed are saved in the panel/API, not here.
# Example: source:gitlab -> project: group/subgroup/project,
# host: gitlab.example.com, cli: /home/me/.local/bin/glab-agent.
